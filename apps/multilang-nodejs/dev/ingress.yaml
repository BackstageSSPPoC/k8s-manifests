apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multilang-nodejs
  namespace: dev
  labels:
    backstage.io/kubernetes-id: multilang-nodejs
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /multilang-nodejs-dev
            pathType: Prefix
            backend:
              service:
                name: multilang-nodejs
                port:
                  number: 80
