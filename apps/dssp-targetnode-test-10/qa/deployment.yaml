apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetnode-test-10
  namespace: qa
  labels:
    app: dssp-targetnode-test-10
    backstage.io/kubernetes-id: dssp-targetnode-test-10
    environment: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dssp-targetnode-test-10
  template:
    metadata:
      labels:
        app: dssp-targetnode-test-10
        backstage.io/kubernetes-id: dssp-targetnode-test-10
        environment: qa
    spec:
      containers:
        - name: dssp-targetnode-test-10
          image: chaitanyapandeygspann/dssp-targetnode-test-10:1.0.3
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "qa"
            - name: URL_PREFIX
              value: /dssp-targetnode-test-10-qa
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
