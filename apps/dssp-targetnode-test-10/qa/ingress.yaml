apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dssp-targetnode-test-10
  namespace: qa
  labels:
    backstage.io/kubernetes-id: dssp-targetnode-test-10
    environment: qa
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /dssp-targetnode-test-10-qa
            pathType: Prefix
            backend:
              service:
                name: dssp-targetnode-test-10
                port:
                  number: 80
