apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-springpackage-15
  namespace: dev
  labels:
    app: dssp-springpackage-15
    backstage.io/kubernetes-id: dssp-springpackage-15
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-springpackage-15
  template:
    metadata:
      labels:
        app: dssp-springpackage-15
        backstage.io/kubernetes-id: dssp-springpackage-15
        environment: dev
    spec:
      containers:
        - name: dssp-springpackage-15
          image: chaitanyapandeygspann/dssp-springpackage-15:1.0.3
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-springpackage-15-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
