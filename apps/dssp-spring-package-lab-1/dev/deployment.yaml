apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-spring-package-lab-1
  namespace: dev
  labels:
    app: dssp-spring-package-lab-1
    backstage.io/kubernetes-id: dssp-spring-package-lab-1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-spring-package-lab-1
  template:
    metadata:
      labels:
        app: dssp-spring-package-lab-1
        backstage.io/kubernetes-id: dssp-spring-package-lab-1
        environment: dev
    spec:
      containers:
        - name: dssp-spring-package-lab-1
          image: chaitanyapandeygspann/dssp-spring-package-lab-1:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-spring-package-lab-1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
