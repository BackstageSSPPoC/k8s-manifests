apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-test
  namespace: dev
  labels:
    app: dssp-targetp-test
    backstage.io/kubernetes-id: dssp-targetp-test
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-test
  template:
    metadata:
      labels:
        app: dssp-targetp-test
        backstage.io/kubernetes-id: dssp-targetp-test
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-test
          image: chaitanyapandeygspann/dssp-targetp-test:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-targetp-test-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
