apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-65
  namespace: dev
  labels:
    app: dssp-targetp-65
    backstage.io/kubernetes-id: dssp-targetp-65
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-65
  template:
    metadata:
      labels:
        app: dssp-targetp-65
        backstage.io/kubernetes-id: dssp-targetp-65
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-65
          image: chaitanyapandeygspann/dssp-targetp-65:1.0.9
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
