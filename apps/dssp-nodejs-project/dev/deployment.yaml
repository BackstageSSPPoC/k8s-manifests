apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-nodejs-project
  namespace: dev
  labels:
    app: dssp-nodejs-project
    backstage.io/kubernetes-id: dssp-nodejs-project
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-nodejs-project
  template:
    metadata:
      labels:
        app: dssp-nodejs-project
        backstage.io/kubernetes-id: dssp-nodejs-project
        environment: dev
    spec:
      containers:
        - name: dssp-nodejs-project
          image: chaitanyapandeygspann/dssp-nodejs-project:1.0.1
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-nodejs-project-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
