apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dssp-spring-package-lab-4
  namespace: dev
  labels:
    backstage.io/kubernetes-id: dssp-spring-package-lab-4
    environment: dev
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /dssp-spring-package-lab-4-dev
            pathType: Prefix
            backend:
              service:
                name: dssp-spring-package-lab-4
                port:
                  number: 80
