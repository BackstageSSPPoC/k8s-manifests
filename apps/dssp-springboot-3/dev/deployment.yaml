apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-springboot-3
  namespace: dev
  labels:
    app: dssp-springboot-3
    backstage.io/kubernetes-id: dssp-springboot-3
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-springboot-3
  template:
    metadata:
      labels:
        app: dssp-springboot-3
        backstage.io/kubernetes-id: dssp-springboot-3
        environment: dev
    spec:
      containers:
        - name: dssp-springboot-3
          image: chaitanyapandeygspann/dssp-springboot-3:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-springboot-3-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
