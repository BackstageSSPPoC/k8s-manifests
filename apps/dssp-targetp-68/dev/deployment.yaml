apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-68
  namespace: dev
  labels:
    app: dssp-targetp-68
    backstage.io/kubernetes-id: dssp-targetp-68
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-68
  template:
    metadata:
      labels:
        app: dssp-targetp-68
        backstage.io/kubernetes-id: dssp-targetp-68
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-68
          image: chaitanyapandeygspann/dssp-targetp-68:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
