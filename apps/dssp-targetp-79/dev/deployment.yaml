apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-79
  namespace: dev
  labels:
    app: dssp-targetp-79
    backstage.io/kubernetes-id: dssp-targetp-79
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-79
  template:
    metadata:
      labels:
        app: dssp-targetp-79
        backstage.io/kubernetes-id: dssp-targetp-79
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-79
          image: chaitanyapandeygspann/dssp-targetp-79:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
