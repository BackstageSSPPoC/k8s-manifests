apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-nodejs-lab1
  namespace: dev
  labels:
    app: dssp-nodejs-lab1
    backstage.io/kubernetes-id: dssp-nodejs-lab1
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-nodejs-lab1
  template:
    metadata:
      labels:
        app: dssp-nodejs-lab1
        backstage.io/kubernetes-id: dssp-nodejs-lab1
        environment: dev
    spec:
      containers:
        - name: dssp-nodejs-lab1
          image: chaitanyapandeygspann/dssp-nodejs-lab1:1.0.2
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-nodejs-lab1-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
