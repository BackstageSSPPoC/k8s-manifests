apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-nodejs-demo-29oct
  namespace: dev
  labels:
    app: dssp-nodejs-demo-29oct
    backstage.io/kubernetes-id: dssp-nodejs-demo-29oct
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-nodejs-demo-29oct
  template:
    metadata:
      labels:
        app: dssp-nodejs-demo-29oct
        backstage.io/kubernetes-id: dssp-nodejs-demo-29oct
        environment: dev
    spec:
      containers:
        - name: dssp-nodejs-demo-29oct
          image: chaitanyapandeygspann/dssp-nodejs-demo-29oct:1.0.1
          ports:
            - containerPort: 3000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-nodejs-demo-29oct-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
