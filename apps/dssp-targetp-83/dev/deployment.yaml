apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-83
  namespace: dev
  labels:
    app: dssp-targetp-83
    backstage.io/kubernetes-id: dssp-targetp-83
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-83
  template:
    metadata:
      labels:
        app: dssp-targetp-83
        backstage.io/kubernetes-id: dssp-targetp-83
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-83
          image: chaitanyapandeygspann/dssp-targetp-83:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-targetp-83-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
