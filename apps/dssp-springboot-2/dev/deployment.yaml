apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-springboot-2
  namespace: dev
  labels:
    app: dssp-springboot-2
    backstage.io/kubernetes-id: dssp-springboot-2
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-springboot-2
  template:
    metadata:
      labels:
        app: dssp-springboot-2
        backstage.io/kubernetes-id: dssp-springboot-2
        environment: dev
    spec:
      containers:
        - name: dssp-springboot-2
          image: chaitanyapandeygspann/dssp-springboot-2:1.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
