apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-springpackage-12
  namespace: dev
  labels:
    app: dssp-springpackage-12
    backstage.io/kubernetes-id: dssp-springpackage-12
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-springpackage-12
  template:
    metadata:
      labels:
        app: dssp-springpackage-12
        backstage.io/kubernetes-id: dssp-springpackage-12
        environment: dev
    spec:
      containers:
        - name: dssp-springpackage-12
          image: chaitanyapandeygspann/dssp-springpackage-12:1.0.7
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-springpackage-12-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
