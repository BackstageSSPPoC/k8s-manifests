apiVersion: apps/v1
kind: Deployment
metadata:
  name: dssp-targetp-100
  namespace: dev
  labels:
    app: dssp-targetp-100
    backstage.io/kubernetes-id: dssp-targetp-100
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssp-targetp-100
  template:
    metadata:
      labels:
        app: dssp-targetp-100
        backstage.io/kubernetes-id: dssp-targetp-100
        environment: dev
    spec:
      containers:
        - name: dssp-targetp-100
          image: chaitanyapandeygspann/dssp-targetp-100:1.0.1
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "dev"
            - name: URL_PREFIX
              value: /dssp-targetp-100-dev
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
