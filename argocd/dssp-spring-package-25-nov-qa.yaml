apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dssp-spring-package-25-nov-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BackstageSSPPoC/k8s-manifests.git
    targetRevision: main
    path: apps/dssp-spring-package-25-nov/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
